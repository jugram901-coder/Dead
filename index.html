 const d=devicePixelRatio||1,w=Math.floor(vz.clientWidth*d),h=Math.floor(vz.clientHeight*d);if(vz.width!=w||vz.height!=h){vz.width=w;vz.height=h}
 vx.clearRect(0,0,w,h);const n=36,bw=w/n,pl=!au.paused;if(an&&pl)an.getByteFrequencyData(fd);

const lyTry=new Set();
async function fetchLy(s){const ti=s.title.replace(/\s*[\(\[][^)\]]*[\)\]]/g,"").replace(/\s-\s.*$/,"").trim(),a=main(s),d=au.duration||0,u=n=>"https://lrclib.net/api/search?"+new URLSearchParams(n);
 try{let r=await fetch(u({track_name:ti,artist_name:a})),j=r.ok?await r.json():[];if(!j.length){r=await fetch(u({q:ti+" "+a}));j=r.ok?await r.json():[]}
  j=j.filter(x=>x.syncedLyrics||x.plainLyrics).map(x=>({x,df:d?Math.abs(x.duration-d):0})).filter(o=>!d||o.df<=8).sort((p,q)=>((p.df>3?p.df:0)-(q.df>3?q.df:0))||((q.x.syncedLyrics?1:0)-(p.x.syncedLyrics?1:0)));
  if(j[0]){s.lyrics=j[0].x.syncedLyrics||j[0].x.plainLyrics;persist()}}catch(e){}
 const c=cur();if(mode==1&&c&&c.id==s.id)lyRender()}
function parseLy(tx){const L=[];let sync=false;for(const ln of (tx||"").split(/\r\n|\r|\n/)){const m=[...ln.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)],x=ln.replace(/\[[^\]]*\]/g,"").trim();if(m.length){sync=true;for(const z of m)L.push({t:+z[1]*60+parseFloat(z[2].replace(":",".")),x})}else if(!/^\[[a-z]+:/i.test(ln.trim()))L.push({t:null,x:ln.trim()})}return sync?{sync:true,L:L.filter(l=>l.t!=null).sort((a,b)=>a.t-b.t)}:{sync:false,L}}

 if(!s||!s.lyrics){lyP=null;a.className="";if(s&&set.ly&&!lyTry.has(s.id)){lyTry.add(s.id);a.innerHTML=`<div class="lyn">${t("lysrch")}</div>`;fetchLy(s);return}

 lyP=parseLy(s.lyrics);a.className=lyP.sync?"":"plain";a.scrollTop=0;
 a.innerHTML=lyP.L.map(l=>`<p ${l.t!=null?`data-t="${l.t}"`:""}>${esc(l.x)||"♪"}</p>`).join("")+`<div class="lyn"><button class="btn" data-m="le">${t("lyed")}</button></div>`}

function lyModal(){const s=cur();if(!s)return;$("#modal").innerHTML=`<div class="card glass"><div class="top"><button class="btn" data-m="x">${t("cancel")}</button><b>${t("lyrics")}</b><button class="btn" data-m="ls"><b>${t("save")}</b></button></div><textarea id="lt" class="fld" style="width:100%;height:42vh;margin-top:10px;resize:none" placeholder="${t("lyph")}">${esc(s.lyrics||"")}</textarea><button class="pill glass" data-m="li" style="width:100%;margin-top:12px">${t("lyimp")}</button></div>`;$("#modal").classList.add("open")}
