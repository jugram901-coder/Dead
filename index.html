async function shareSong(){const s=cur();if(!s)return;const tx={title:s.title,text:s.title+" — "+s.artist};
 try{const b=s.blob,f=b instanceof File?b:new File([b],s.title+"."+((b.type.split("/")[1]||"mp3").replace("mpeg","mp3").replace("x-","")),{type:b.type});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],...tx});else if(navigator.share)await navigator.share(tx);else toast(t("noshare"))}catch(e){if(e&&e.name!="AbortError")toast(t("noshare"))}}
